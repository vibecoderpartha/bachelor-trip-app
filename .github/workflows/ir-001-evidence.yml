name: IR-001 evidence capability

on:
  workflow_dispatch:
  pull_request:
    branches:
      - v2

permissions:
  contents: read

concurrency:
  group: ir-001-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-evidence:
    name: Browser evidence
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:types
      - run: npm test
      - run: npm run build
      - run: npm run test:browser:install
      - run: npm run test:browser
      - run: npm run test:browser:failure
      - run: IR001_EVIDENCE_JOB=browser npm run test:evidence:manifest
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ir-001-browser-evidence
          path: |
            artifacts/ir-001/browser/retained
            artifacts/ir-001/evidence-manifest.json
          retention-days: 14
          if-no-files-found: warn

  database-evidence:
    name: Database and RLS evidence
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:types
      - run: npm test
      - run: npm run build
      - name: Run initial normal database evidence
        id: database_initial_normal
        continue-on-error: true
        env:
          IR001_RETAIN_HOSTED_NORMAL_FAILURE: 'true'
          IR001_TESTED_COMMIT_SHA: ${{ github.sha }}
        run: npm run test:db
      - name: Run controlled database failure evidence
        if: steps.database_initial_normal.outcome == 'success'
        run: npm run test:db:failure
      - name: Run recovery normal database evidence
        if: steps.database_initial_normal.outcome == 'success'
        run: npm run test:db
      - name: Write database evidence manifest
        if: steps.database_initial_normal.outcome == 'success'
        run: IR001_EVIDENCE_JOB=database npm run test:evidence:manifest
      - name: Fail after retaining first-normal diagnostic
        if: steps.database_initial_normal.outcome == 'failure'
        run: exit 1
      - name: Assert exact local database cleanup
        if: always()
        run: npm run test:db:cleanup
      - name: Retain database evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ir-001-database-evidence
          path: |
            artifacts/ir-001/database/normal-result.json
            artifacts/ir-001/database/controlled-failure-result.json
            artifacts/ir-001/database/recovery-result.json
            artifacts/ir-001/database/hosted-normal-failure.json
            artifacts/ir-001/evidence-manifest.json
          retention-days: 14
          if-no-files-found: warn
